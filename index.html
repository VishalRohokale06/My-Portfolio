<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>

<body>
    <nav class="navbar">
        <div class="maindiv">
            <div class="imgdiv">
                <img src="aasets/ps.png" alt="ps" class="pimg" />
                <span>Vishal.</span>
            </div>
            <div>
                <button class="navbutton">Home</button>
                <button class="navbutton">Experience</button>
                <button class="navbutton">Skills</button>
                <button class="navbutton">Eduction</button>
                <button class="navbutton">Projects</button>
                <button class="navbutton">Contact</button>
            </div>
            <div class="navtalk">
                <span>Let's Talk</span>
                <i class="fa-solid fa-square-up-right"></i>
            </div>
        </div>
    </nav>
    <main>
        <section class="video-section">
            <div class="namediv">
                <h1 class="hi">Hi, I'm</h1>
                <span class="name">Vishal Rohokale</span>
                <h3 class="description">
                    I enjoy figuring things out, experimenting with new technologies,
                    and building things that I wish existed.
                </h3>
                <div class="btndiv">
                    <div class="myworkdiv">
                        <span>View My Work</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                    <div class="intouchdiv">
                        <span>Get in Touch</span>
                       <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>
            </div>
            <div class="hero-video">
                <video autoplay muted loop playsinline class="bg-video">
                    <source src="aasets/b1.mp4" type="video/mp4" />
                </video>
            </div>
        </section>
    </main>
</body>

</html>
